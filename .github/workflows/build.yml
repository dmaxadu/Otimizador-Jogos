name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Compilar
        run: dotnet build OtimizadorJogos.sln -c Release

      - name: Gerar executável único (win-x64, não precisa instalar .NET)
        run: >
          dotnet publish src/OtimizadorJogos/OtimizadorJogos.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=none
          -o publish

      - name: Empacotar a versão em script
        shell: pwsh
        run: Compress-Archive -Path scripts/* -DestinationPath publish/OtimizadorJogos-script.zip

      - name: Guardar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: OtimizadorJogos-win-x64
          path: |
            publish/OtimizadorJogos.exe
            publish/OtimizadorJogos-script.zip

      - name: Publicar release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/OtimizadorJogos.exe
            publish/OtimizadorJogos-script.zip
          generate_release_notes: true
